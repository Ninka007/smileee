<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine? ❤️</h1>
    <p>
      Miles apart, but my heart stays with you every single day 🌍💞<br><br>
      I couldn’t wait till Valentine’s Day to ask you.
    </p>

    <button id="yes">Yes 💕</button>
    <button id="no">No 🥲</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
